<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>C3TD 部員タワーディフェンス</title>
    <!--
      C3TD のブラウザ版の入れ物（WebBuild.Build で使う）。
      ・パソコンでもスマホでも、窓いっぱいにゲームを出す。16:9 より縦長の窓では上下に帯を入れ、横長の窓（スマホの横向き）はそのまま広げる
      ・スマホが縦向きのときは「横向きにしてね」を出す
      ・スマホは描く解像度を画面の2倍までにして軽くする
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f1a; overscroll-behavior: none; }
      body { color: #eef1f6; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #0b0f1a; touch-action: none; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0f1a; }
      #loading .title { font-size: 44px; font-weight: 800; letter-spacing: 0.3em; padding-left: 0.3em; }
      #loading .sub { font-size: 14px; color: #8e98ac; letter-spacing: 0.2em; }
      #bar { width: min(320px, 70vw); height: 6px; background: rgba(255,255,255,0.12); }
      #bar-full { width: 0%; height: 100%; background: #f4b63f; transition: width 0.2s; }
      #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0f1a; z-index: 10; text-align: center; font-size: 20px; line-height: 1.6; }
      #rotate .phone { width: 46px; height: 80px; border: 4px solid #f4b63f; border-radius: 10px; animation: turn 2s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      /* 全画面ボタンは上のまん中（右下は編成バー、左上は作戦名、右上は一時停止があるため） */
      #fullscreen { position: fixed; left: 50%; top: 4px; transform: translateX(-50%); opacity: 0.65; width: 34px; height: 30px; border: 1px solid rgba(255,255,255,0.25); background: rgba(11,15,26,0.7); color: #eef1f6; font-size: 18px; line-height: 28px; text-align: center; cursor: pointer; display: none; z-index: 5; border-radius: 4px; }
      #warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 20; }
      #warning div { background: #f4b63f; color: #111; padding: 8px 14px; margin-bottom: 6px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <div class="title">C3TD</div>
      <div class="sub">部員タワーディフェンス（仮）</div>
      <div id="bar"><div id="bar-full"></div></div>
    </div>
    <div id="rotate"><div class="phone"></div><div>スマホを横向きにしてね</div></div>
    <div id="fullscreen" title="全画面">⛶</div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

      // 16:9 より縦長なら幅に合わせて上下に帯、横長ならそのまま（ただし 2.4:1 まで）
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var cw = w, ch = h;
        if (w / h < 16 / 9) ch = Math.round(w * 9 / 16);
        else if (w / h > 2.4) cw = Math.round(h * 2.4);
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        document.querySelector("#rotate").style.display = isMobile && h > w ? "flex" : "none";
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });
      fit();

      function unityShowBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.style.background = "#ff5a6a";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      // スマホは描く解像度を画面の2倍までにして軽くする
      if (isMobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      // スクロールやピンチで画面が動かないように
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-full").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").style.display = "none";
          var fs = document.querySelector("#fullscreen");
          fs.style.display = "block";
          fs.onclick = function () { unityInstance.SetFullscreen(1); };
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
